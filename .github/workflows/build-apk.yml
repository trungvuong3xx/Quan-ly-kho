name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - gh-pages
    paths:
      - 'app.js'
      - 'quetqr.js'
      - 'kiemke.js'
      - 'cx1.js'
      - 'cx5.js'
      - 'btp.js'
      - 'tonkho.js'
      - 'index.html'
      - 'style.css'
      - 'package.json'
      - 'build-web.js'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build APK (Capacitor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses & Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle_log.txt
          exit ${PIPESTATUS[0]}

      - name: Stage APK for Upload
        run: |
          mkdir -p output_apk
          find android -name "*.apk" -type f -exec cp {} output_apk/QuanLyKho.apk \;
          ls -la output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyKho-APK
          path: output_apk/QuanLyKho.apk
          retention-days: 30

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: app-latest
          name: "Phiên Bản Android APK Cài Đặt Trực Tiếp"
          body: "Tải file QuanLyKho.apk bên dưới để cài đặt trực tiếp lên điện thoại mà không cần giải nén zip."
          files: output_apk/QuanLyKho.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B build-log-branch
          echo "=== BUILD LOG ===" > error_summary.txt
          tail -n 150 /tmp/gradle_log.txt >> error_summary.txt 2>/dev/null || true
          git add -f error_summary.txt
          git commit -m "chore: save build log"
          git push origin build-log-branch --force || true
