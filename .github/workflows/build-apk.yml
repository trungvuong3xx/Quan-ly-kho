name: Build Android APK

on:
  workflow_dispatch: # Cho phép bấm nút "Run workflow" bất kỳ lúc nào trên GitHub
  push:
    branches:
      - main
      - gh-pages
    paths:
      - 'app.js'
      - 'index.html'
      - 'package.json'
      - 'build-web.js'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build APK (Capacitor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Ensure Android Assets Directory
        run: mkdir -p android/app/src/main/assets/public

      - name: Copy Web to Android Assets
        run: npx cap copy android

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Rename APK for Clarity
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk QuanLyKho.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyKho-APK
          path: QuanLyKho.apk
          retention-days: 30
