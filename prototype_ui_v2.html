<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Giao diện Mẫu - Bento UI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --glass-blur: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            padding: 24px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            background: linear-gradient(to bottom, var(--bg-color) 40%, transparent);
        }
        .header-title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-user {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(var(--glass-blur));
        }

        /* Dashboard Grid (Bento Box style) */
        .dashboard {
            padding: 10px 20px 120px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-auto-rows: 110px;
            gap: 16px;
            flex-grow: 1;
        }
        
        .bento-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }
        
        .bento-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 100%);
            pointer-events: none;
        }

        .bento-card:active {
            transform: scale(0.96);
        }

        .card-large {
            grid-column: span 2;
            grid-row: span 1;
            flex-direction: row;
            align-items: center;
        }
        .card-tall {
            grid-row: span 2;
        }

        .card-icon {
            font-size: 28px;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
        }
        .card-value {
            font-size: 28px;
            font-weight: 700;
            margin-top: auto;
        }
        .text-x5 { color: #34d399; }
        .text-x1 { color: #f472b6; }
        .text-btp { color: #fbbf24; }

        /* Floating Nav & Scan Button */
        .bottom-nav-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 400px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 40px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #64748b;
            text-decoration: none;
            width: 60px;
            height: 50px;
            transition: color 0.2s;
        }
        .nav-item.active {
            color: #38bdf8;
        }
        .nav-item i {
            font-size: 24px;
            margin-bottom: 4px;
        }
        .nav-label {
            font-size: 11px;
            font-weight: 600;
        }

        /* Nút quét siêu to khổng lồ ở giữa */
        .scan-fab {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 0 25px var(--accent-glow), inset 0 2px 5px rgba(255,255,255,0.3);
            border: 4px solid var(--bg-color);
            transform: translateY(-25px);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .scan-fab:active {
            transform: translateY(-25px) scale(0.9);
            box-shadow: 0 0 10px var(--accent-glow);
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">Quản lý Kho</div>
        <div class="header-user"><i class="ti ti-user"></i></div>
    </div>

    <div class="dashboard">
        <!-- Thẻ Tổng quan ngang -->
        <div class="bento-card card-large">
            <div>
                <div class="card-icon"><i class="ti ti-chart-bar text-x5"></i></div>
                <div class="card-title">Tổng sản phẩm đã quét</div>
            </div>
            <div class="card-value">1,204</div>
        </div>

        <!-- Thẻ vuông -->
        <div class="bento-card">
            <div class="card-icon"><i class="ti ti-box text-x5"></i></div>
            <div class="card-title">Chỉ X5</div>
            <div class="card-value text-x5">450</div>
        </div>

        <div class="bento-card">
            <div class="card-icon"><i class="ti ti-box text-x1"></i></div>
            <div class="card-title">Chỉ X1</div>
            <div class="card-value text-x1">320</div>
        </div>

        <div class="bento-card">
            <div class="card-icon"><i class="ti ti-package text-btp"></i></div>
            <div class="card-title">BTP</div>
            <div class="card-value text-btp">434</div>
        </div>
        
        <div class="bento-card">
            <div class="card-icon" style="color: #cbd5e1"><i class="ti ti-settings"></i></div>
            <div class="card-title" style="color: #cbd5e1; margin-top: auto;">Cài đặt & Đồng bộ</div>
        </div>
    </div>

    <!-- Thanh điều hướng Floating -->
    <div class="bottom-nav-container">
        <a href="#" class="nav-item active">
            <i class="ti ti-home"></i>
            <div class="nav-label">Trang chủ</div>
        </a>
        <a href="#" class="nav-item">
            <i class="ti ti-list"></i>
            <div class="nav-label">Danh mục</div>
        </a>
        
        <!-- Nút Quét Floating -->
        <div class="scan-fab" onclick="alert('Mở camera quét QR đa năng')">
            <i class="ti ti-scan"></i>
        </div>

        <a href="#" class="nav-item">
            <i class="ti ti-history"></i>
            <div class="nav-label">Lịch sử</div>
        </a>
        <a href="#" class="nav-item">
            <i class="ti ti-chart-pie"></i>
            <div class="nav-label">Thống kê</div>
        </a>
    </div>

</body>
</html>
